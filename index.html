<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Calendar + Forecast (3-hour / 5 days)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="app-header">
    <h1 class="month-title" id="monthTitle"></h1>

    <!-- 年月ジャンプ用ドロップダウン -->
    <div class="jump-form">
      <select id="jumpYear">
        <option value="2024">2024年</option>
        <option value="2025" selected>2025年</option>
        <option value="2026">2026年</option>
      </select>
      <select id="jumpMonth">
        <option value="0">1月</option>
        <option value="1" selected>2月</option>
        <option value="2">3月</option>
        <option value="3">4月</option>
        <option value="4">5月</option>
        <option value="5">6月</option>
        <option value="6">7月</option>
        <option value="7">8月</option>
        <option value="8">9月</option>
        <option value="9">10月</option>
        <option value="10">11月</option>
        <option value="11">12月</option>
      </select>
      <button id="jumpBtn" class="nav-btn">移動</button>
    </div>

    <!-- 位置情報を取得して5日間予報を呼び出す -->
    <button id="getLocationBtn" class="nav-btn">現在地を取得</button>
  </header>

  <main class="calendar-container">
    <div class="calendar-grid" id="calendarGrid">
      <!-- script.jsで動的に日付セルを作成 -->
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
